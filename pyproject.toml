[project]
name = "evo2-sae-handson"
version = "0.1.0"
description = "Helpers for the Evo 2 sparse autoencoder hands-on notebook"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "requests", "coolbox", "py3Dmol"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evo2_sae"]
